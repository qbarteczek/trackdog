plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pl.qbart.trackdog'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.qbart.trackdog'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError false
    }
}

// No libraries on purpose: the app uses only the Android framework.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
