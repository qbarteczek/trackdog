<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- TrackDog: retriever profile inside a compass. Same paths as app/src/main/res/drawable/ic_logo.xml -->
  <rect width="108" height="108" fill="#12241F"/>
  <!-- compass ring -->
  <circle cx="54" cy="54" r="38" fill="#183029" stroke="#E7B55C" stroke-width="2.4"/>
  <circle cx="54" cy="54" r="33.2" fill="none" stroke="#E7B55C" stroke-opacity="0.35" stroke-width="0.8"/>
  <!-- cardinal ticks E, S, W -->
  <path d="M92 54h-3.5M54 92v-3.5M16 54h3.5" stroke="#E7B55C" stroke-width="2.4" stroke-linecap="round"/>
  <!-- intercardinal ticks -->
  <path d="M80.9 27.1l-2.6 2.6M80.9 80.9l-2.6-2.6M27.1 80.9l2.6-2.6M27.1 27.1l2.6 2.6" stroke="#E7B55C" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- north pointer -->
  <path d="M54 9.5L59.2 21.5L54 18.8L48.8 21.5Z" fill="#E4572E"/>
  <!-- retriever head, facing right -->
  <path d="M33.5 84
           C32.5 74 32 66 33.5 58
           C34 50 35.5 43 40 37.5
           C44.5 32 51 29.5 57.5 30.5
           C62 31.2 65.5 33.5 67.5 37
           C69 39.6 71.5 41 75 41.6
           C79.5 42.4 83.5 43.4 85.6 45.6
           C87.4 47.5 87.3 50.3 85.6 52
           C84.6 53 83.2 53.6 81.8 53.8
           C82.6 55.2 82.2 57 80.6 57.8
           C76.5 59.8 71 60.6 66.5 60.4
           C63.6 60.3 61.6 61.6 61 64.4
           C60.2 68.4 61.4 73 63.6 77.5
           C64.8 80 65.6 82 66 84
           C58 89 42 89 33.5 84Z" fill="#E7B55C"/>
  <!-- ear -->
  <path d="M43.5 38.5
           C47.5 35.8 53 36.4 55.4 40
           C57.4 43 56.6 47.6 55.4 52
           C54.2 56.6 52.4 61.4 49 63.6
           C46.4 65.2 43.6 63.8 42.4 60.6
           C40.4 55 40 45 43.5 38.5Z" fill="#B9832F"/>
  <!-- eye -->
  <circle cx="64.2" cy="41.6" r="1.7" fill="#12241F"/>
  <!-- nose -->
  <path d="M83 44.6C85.4 44.9 87 46.4 87 48.3C87 49.6 85.9 50.3 84.6 50C83.2 49.6 82.3 47.2 83 44.6Z" fill="#12241F"/>
  <!-- mouth -->
  <path d="M81.8 53.8C78.5 54.6 74.8 54.4 71.6 53.2" fill="none" stroke="#12241F" stroke-width="1.1" stroke-linecap="round"/>
  <!-- collar with a compass-rose tag -->
  <path d="M33.2 74.5C42 79.5 54 79.8 63 76.2L64.6 79.8C55 84 42 83.6 33.4 78.8Z" fill="#E4572E"/>
  <path d="M50 77.6L51.4 81.8L55.6 83.2L51.4 84.6L50 88.8L48.6 84.6L44.4 83.2L48.6 81.8Z" fill="#F6EBD6"/>
</svg>
